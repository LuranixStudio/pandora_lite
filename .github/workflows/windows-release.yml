name: Windows Release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pandora-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 Release
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Verify executable starts
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\build\Release\pandora_lite.exe -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "Application exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Verify updater replacement and tamper rejection
        shell: pwsh
        run: .\test_update.ps1
      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\build\Release\pandora_lite.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$env:GITHUB_RUN_NUMBER`n$hash" | Set-Content -Encoding ascii release.txt
      - name: Package executable
        uses: actions/upload-artifact@v4
        with:
          name: pandora-lite-windows-x64
          path: |
            build/Release/pandora_lite.exe
            release.txt
            LICENSE.txt
            IMGUI_LICENSE.txt
            CLEAN_BUILD.md
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pandora-lite-windows-x64
          path: package
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: pandora-build-${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          gh release create "$RELEASE_TAG"
          package/build/Release/pandora_lite.exe package/release.txt
          package/LICENSE.txt package/IMGUI_LICENSE.txt package/CLEAN_BUILD.md
          --target "$RELEASE_COMMIT" --title "Pandora build ${{ github.run_number }}"
          --notes "Windows x64 build. Movement checks, startup and updater replacement tests passed. Game behavior and executor compatibility are not certified."
          --latest
